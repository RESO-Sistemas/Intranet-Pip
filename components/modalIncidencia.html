<!-- Modal Incidencia -->
<div class="modal fade" id="modalIncidencia" tabindex="-1" aria-labelledby="modalIncidenciaTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalIncidenciaTitle">Registrar Incidencia</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="formIncidencia" enctype="multipart/form-data">
          <div class="mb-3">
            <label for="incidencia_desc" class="form-label fw-bold">Descripción</label>
            <textarea id="incidencia_desc" name="incidencia_desc" class="form-control" rows="3" required></textarea>
            <p for="incidencia_desc" data-msg="La descripción es obligatoria." class="text-danger small mb-0"></p>
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold">Evidencia (solo imagen)</label>
            <div id="fileUploadIncidencia" class="file-container border rounded p-3 bg-light"></div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
        <button id="btnIncidenciaGuardar" type="button" class="btn btn-primary">Guardar Incidencia</button>
      </div>
    </div>
  </div>
</div>
